  body { background: #000; color: #e7e9ea; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; margin: 0; }
  .timeline { max-width: 600px; margin: 0 auto; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 100vh; padding-bottom: 140px; }
  .pagehead { padding: 12px 16px; font-weight: 800; font-size: 18px; border-bottom: 1px solid #2f3336; position: sticky; top: 0; background: rgba(0,0,0,.85); }
  article[data-testid="tweet"] { position: relative; padding: 12px 16px; border-bottom: 1px solid #2f3336; cursor: default; }
  article[data-testid="tweet"]:hover { background: #080808; }
  .row { display: flex; gap: 12px; }
  .ava { width: 40px; height: 40px; border-radius: 50%; background: #2f3336; flex: none; }
  .main { flex: 1; min-width: 0; }
  .u { display: flex; gap: 6px; align-items: center; font-size: 15px; margin: 0 0 4px; }
  .u a { color: #e7e9ea; font-weight: 700; text-decoration: none; }
  .u .handle, .u .time { color: #71767b; font-weight: 400; font-size: 15px; }
  [data-testid="tweetText"] { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .side { position: fixed; right: 24px; top: 16px; color: #71767b; font-size: 12px; max-width: 220px; }
</style>

<script>
/* ---------- chrome mock（必须在业务脚本之前） ---------- */
(function () {
  var store = {
    settings: { enabled: true, sensitivity: 'standard', dailyLimit: 50, minDelayMs: 800, maxDelayMs: 2000, showBadge: true },
    marks: {},
    whitelist: {},
    stats: { totalBlocked: 0, dailyDate: '', dailyBlocked: 0 },
    queueState: { paused: false, reason: null, pausedUntil: 0, lastError: null },
    queue: []
  };
  var listeners = [];
  function fire(keys) {
    var changes = {};
    keys.forEach(function (k) { changes[k] = { newValue: store[k] }; });
    listeners.forEach(function (fn) { fn(changes, 'local'); });
  }
  window.chrome = {
    runtime: {
      id: 'fixture-extension-id',
      lastError: undefined,
      sendMessage: function (msg, cb) {
        if (msg && msg.type === 'ENQUEUE_BLOCKS') {
          var n = (msg.users || []).length;
          setTimeout(function () {
            (msg.users || []).forEach(function (u) {
              store.marks[u.screenName.toLowerCase()] = { ts: Date.now(), status: 'blocked' };
            });
            fire(['marks']);
          }, 600);
          setTimeout(function () { cb({ ok: true, queued: n }); }, 30);
          return;
        }
        if (msg && msg.type === 'GET_STATE') { cb({ ok: true, state: { queueLength: store.queue.length } }); return; }
        if (msg && msg.type === 'RESUME_QUEUE') { cb({ ok: true }); return; }
        cb({ ok: false });
      }
    },
    storage: {
      local: {
        get: function (keys, cb) {
          var out = {};
          (Array.isArray(keys) ? keys : [keys]).forEach(function (k) { if (k in store) out[k] = store[k]; });
          setTimeout(function () { cb(out); }, 0);
        },
        set: function (obj, cb) {
          Object.keys(obj).forEach(function (k) { store[k] = obj[k]; });
          setTimeout(function () { fire(Object.keys(obj)); if (cb) cb(); }, 0);
        }
      },
      onChanged: { addListener: function (fn) { listeners.push(fn); }, removeListener: function (fn) { listeners = listeners.filter(function (f) { return f !== fn; }); } }
    }
  };
  // 模拟已登录（ct0 cookie）
  try { Object.defineProperty(document, 'cookie', { get: function () { return 'ct0=fixture-csrf-token; auth_token=fixture'; }, configurable: true }); } catch (e) {}
})();

</script>

<!-- ?autoblock=1：自动点击第一个「拉黑」与「一键清理」，验证 blocked 状态流转（仅测试用） -->
<!-- ?clobber=1：模拟 X 的 React 在 hover 重渲染时重写 className，验证属性选择器高亮不被抹掉 -->
<script>
if (location.search.indexOf('autoblock') !== -1) {
  setTimeout(function () {
    var btn = document.querySelector('.tz-btn-block');
    if (btn) btn.click();
  }, 800);
  setTimeout(function () {
    var clear = document.querySelector('#tz-badge .tz-clear');
    if (clear && !clear.disabled) clear.click();
  }, 1600);
}
if (location.search.indexOf('clobber') !== -1) {
  setTimeout(function () {
    document.querySelectorAll('article[data-tz="flag"]').forEach(function (a) {
      a.className = 'css-175oi2r r-clobbered-by-react'; // 模拟 React 抹掉 tz-flag
    });
  }, 2000);
}
</script>
